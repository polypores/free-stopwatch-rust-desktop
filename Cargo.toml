[package]
name = "rustwatch"
version = "0.1.0"
edition = "2021"
description = "A lightweight Windows 11 stopwatch app"

[dependencies]
# glow (OpenGL) backend is lighter on RAM than wgpu for a simple 2D UI like this.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Windows-only: hides the console window that would otherwise pop up
# alongside the GUI window on launch.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wincon", "winuser"] }

[profile.release]
opt-level = "z"      # optimize for small binary size -> smaller memory footprint
lto = true            # link-time optimization
codegen-units = 1
panic = "abort"       # smaller binary, no unwinding tables
strip = true          # strip symbols
